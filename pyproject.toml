[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-trauma"
version = "0.1.0"
description = "30-day survival prediction after spinal trauma consult"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]
